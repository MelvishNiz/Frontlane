{{define "header"}}
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{.Title}} · PrivateWG</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app-shell">
  <aside class="rail">
    <a class="brand" href="/" aria-label="PrivateWG home"><span class="brand-mark">PW</span><span>PrivateWG</span></a>
    <nav aria-label="Navigasi utama">
      <a href="/">Ringkasan</a>
      <a href="/peers">Peer</a>
      <a href="/services">Domain</a>
    </nav>
    <div class="rail-foot">
      <span class="status-dot"></span><span>10.77.0.1</span>
      <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="link-button" type="submit">Keluar</button></form>
    </div>
  </aside>
  <main>
    <header class="topbar"><div><p class="eyebrow">PRIVATE NETWORK CONTROL</p><h1>{{.Title}}</h1></div><div class="identity"><span>{{.User}}</span><small>{{.PanelDomain}}</small></div></header>
    {{if .Error}}<div class="alert error" role="alert">{{.Error}}</div>{{end}}
    {{if .Notice}}<div class="alert notice" role="status">{{.Notice}}</div>{{end}}
{{end}}

{{define "footer"}}
  </main>
</div>
<script src="/static/app.js" defer></script>
</body>
</html>
{{end}}
