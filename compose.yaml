services:
  privatewg:
    image: ${PRIVATEWG_SERVER_IMAGE:-ghcr.io/melvishniz/privatewg-server:latest}
    build: .
    pull_policy: build
    container_name: privatewg
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    environment:
      PWG_LISTEN: "10.77.0.1:8080"
      PWG_PUBLIC_ENDPOINT: "${PWG_PUBLIC_ENDPOINT}"
      PWG_BASE_DOMAIN: "${PWG_BASE_DOMAIN}"
      PWG_ADMIN_USER: "${PWG_ADMIN_USER:-admin}"
      PWG_ADMIN_PASSWORD: "${PWG_ADMIN_PASSWORD}"
      PWG_COOKIE_SECURE: "true"
    volumes:
      - ./data/privatewg:/data/privatewg
      - ./data/wireguard:/etc/wireguard
      - ./data/traefik/dynamic:/data/traefik/dynamic
      - ./data/coredns:/data/coredns

  traefik:
    image: traefik:v3.7.12
    container_name: privatewg-traefik
    restart: unless-stopped
    network_mode: host
    depends_on:
      - privatewg
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.aliasheadersstrategy=delete
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.aliasheadersstrategy=delete
      - --providers.providersthrottleduration=500ms
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.email=${PWG_ACME_EMAIL:?PWG_ACME_EMAIL is required}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --api.dashboard=true
      - --api.basepath=/traefik
      - --accesslog=true
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    volumes:
      - ./data/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./data/traefik/letsencrypt:/letsencrypt

  coredns:
    image: coredns/coredns:1.12.0
    container_name: privatewg-coredns
    restart: unless-stopped
    network_mode: host
    depends_on:
      - privatewg
    command: -conf /etc/coredns/Corefile
    volumes:
      - ./deploy/coredns/Corefile:/etc/coredns/Corefile:ro
      - ./data/coredns:/data/coredns:ro

  app-example:
    image: nginx:1.29-alpine
    container_name: privatewg-app-example
    restart: unless-stopped
    profiles: ["example"]
    ports:
      - "127.0.0.1:8081:80"
